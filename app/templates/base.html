<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FitManager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">FitManager</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" href="{% url 'home' %}">Início</a>
            <a class="nav-link" href="{% url 'lista_treinos' %}">Treinos</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'criar_treino' %}">Novo treino</a>
                <form method="post" action="{% url 'logout' %}" class="ms-2">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
                </form>
            {% else %}
                <a class="btn btn-primary btn-sm ms-2" href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">FitManager • Projeto Django — Aula 12</p>
</footer>
</body>
</html>
