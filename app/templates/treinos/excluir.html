{% extends 'base.html' %}

{% block title %}Excluir treino | FitManager{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card p-4 p-md-5 text-center">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle"
                   style="font-size: 60px;"></i>
            </div>

            <h2 class="fw-bold">Excluir treino?</h2>

            <p class="text-secondary mt-2">
                Você está prestes a excluir o treino
                <strong>{{ treino.nome }}</strong>.
            </p>

            <p class="text-secondary">
                Essa ação não poderá ser desfeita.
            </p>

            <form method="post" class="mt-3">
                {% csrf_token %}

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'lista_treinos' %}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-2"></i>Confirmar exclusão
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

{% endblock %}
